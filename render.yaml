services:
  - type: web
    name: teleport
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TARGET_CHAT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "700"
      - key: UPLOAD_DESTINATION
        value: telegram
      - key: TMP_DIR
        value: /tmp
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: DOWNLOAD_RETRY_COUNT
        value: "4"
      - key: ALLOW_PRIVATE_IPS
        value: "false"
