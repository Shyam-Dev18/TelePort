<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shyam's TelePort</title>
  <meta name="description" content="Shyam's TelePort media downloader and uploader for Telegram and Google Drive." />
  <meta name="author" content="Shyam" />
  <meta property="og:title" content="Shyam's TelePort" />
  <meta property="og:description" content="Download, select format, and upload media quickly." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230f766e'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 23h28v6H35v22h-6V29H18z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#0b111f",
            mist: "#f5f8fc",
            panel: "#ffffff",
            borderc: "#dbe4f0",
            accent: "#0f766e",
            accent2: "#2563eb",
            warn: "#dc2626",
          },
          boxShadow: {
            glow: "0 20px 60px rgba(15, 118, 110, 0.18)",
          },
          fontFamily: {
            sans: ["Manrope", "ui-sans-serif", "system-ui"],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ring: rgba(37, 99, 235, 0.24);
    }
    body {
      background:
        radial-gradient(1000px 400px at -5% -10%, rgba(37, 99, 235, 0.16), transparent),
        radial-gradient(900px 360px at 110% 10%, rgba(15, 118, 110, 0.2), transparent),
        linear-gradient(180deg, #eef4fb 0%, #f8fbff 100%);
    }
    .glass {
      /* backdrop-filter removed: blurring animated content behind a large
         element forces the browser to re-sample and re-blur on every frame,
         which was the primary cause of the janky "frame-by-frame" rendering. */
    }
    .field:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px var(--ring);
    }
    .progress-shimmer {
      background-image: linear-gradient(90deg, rgba(255,255,255,0.0), rgba(255,255,255,0.4), rgba(255,255,255,0.0));
      background-size: 200% 100%;
      animation: sweep 1.6s linear infinite;
      will-change: background-position;
    }
    @keyframes sweep {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .orbit-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.28;
    }
    .orbit-ring {
      position: absolute;
      left: 50%;
      top: 58%;
      border: 0;
      background: transparent;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      animation: spin 28s linear infinite;
      /* Promote to its own GPU compositor layer so the spin never touches
         the main-thread layout and the backdrop-filter (now removed) does
         not have to re-sample on every frame. */
      will-change: transform;
      /* Smooth out the size / position tweaks made by randomizePageOrbits */
      transition: width 1.8s ease, height 1.8s ease;
    }
    .orbit-ring.r1 { width: 950px; height: 950px; }
    .orbit-ring.r2 { width: 740px; height: 740px; animation-direction: reverse; animation-duration: 22s; }
    .orbit-ring.r3 { width: 520px; height: 520px; animation-duration: 18s; }
    .platform-chip {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #ffffff;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.22);
    }
    .logo-svg {
      width: 58px;
      height: 58px;
      display: block;
      fill: currentColor;
    }
    .platform-chip.ig {
      left: -48px;
      top: 40%;
      background: radial-gradient(circle at 30% 20%, #ffd36a, #f00073 58%, #5b2ef5);
    }
    .platform-chip.fb {
      left: 78%;
      top: -44px;
      background: radial-gradient(circle at 30% 20%, #70adff, #0b5dd7);
    }
    .platform-chip.x {
      right: -42px;
      top: 52%;
      background: radial-gradient(circle at 30% 20%, #6b7280, #0f172a);
    }
    .platform-chip.link {
      left: 10%;
      bottom: -40px;
      background: radial-gradient(circle at 30% 20%, #67e8f9, #0284c7);
    }
    .platform-chip.yt {
      left: 45%;
      bottom: -44px;
      background: radial-gradient(circle at 30% 20%, #ff7474, #d90429);
    }

    .input-orbit-wrap {
      position: relative;
    }
    .input-orbit-layer {
      position: absolute;
      inset: -30px -28px;
      pointer-events: none;
      opacity: 0.34;
      z-index: 0;
    }
    .input-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(100% + 80px);
      height: 130px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      animation: spin 16s linear infinite;
      will-change: transform;
    }
    .input-ring.rev {
      animation-direction: reverse;
      animation-duration: 12s;
    }
    .input-chip {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
    }
    .input-chip .logo-svg {
      width: 26px;
      height: 26px;
    }
    .input-chip.ig { left: 5%; top: 58%; background: linear-gradient(150deg, #ffd36a, #f00073 58%, #5b2ef5); }
    .input-chip.fb { right: 8%; top: 14%; background: linear-gradient(150deg, #69a8ff, #0b5dd7); }
    .input-chip.x { right: 30%; bottom: 0%; background: linear-gradient(150deg, #9ca3af, #111827); }
    .input-chip.yt { left: 35%; top: -8%; background: linear-gradient(150deg, #ff6b6b, #d90429); }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 640px) {
      .orbit-background { opacity: 0.2; }
      .orbit-ring.r1 { width: 680px; height: 680px; }
      .orbit-ring.r2 { width: 520px; height: 520px; }
      .orbit-ring.r3 { width: 380px; height: 380px; }
      .platform-chip { width: 80px; height: 80px; font-size: 36px; }
      .platform-chip .logo-svg { width: 38px; height: 38px; }
      .input-orbit-layer { inset: -22px -12px; }
      .input-ring { height: 110px; width: calc(100% + 36px); }
      .input-chip { width: 42px; height: 42px; }
      .input-chip .logo-svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body class="min-h-screen text-ink">
  <div class="orbit-background" aria-hidden="true">
    <div class="orbit-ring r1">
      <span class="platform-chip ig" title="Instagram">
        <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5Zm8.95 1.55a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6ZM12 7.1A4.9 4.9 0 1 1 7.1 12 4.9 4.9 0 0 1 12 7.1Zm0 1.8A3.1 3.1 0 1 0 15.1 12 3.1 3.1 0 0 0 12 8.9Z"/></svg>
      </span>
      <span class="platform-chip fb" title="Facebook">
        <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 22v-8.2h2.76l.42-3.2h-3.18V8.56c0-.93.26-1.56 1.59-1.56h1.7V4.14c-.82-.1-1.65-.15-2.47-.14-2.45 0-4.12 1.5-4.12 4.25v2.37H7v3.2h2.81V22h3.29Z"/></svg>
      </span>
      <span class="platform-chip x" title="X">
        <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.78L23.2 22h-6.3l-4.94-6.95L5.9 22H2.8l7.3-8.34L.8 2h6.45l4.45 6.27L18.9 2Zm-1.1 18h1.75L6.3 3.9H4.43L17.8 20Z"/></svg>
      </span>
      <span class="platform-chip link" title="Direct URL">
        <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 13.41a1 1 0 0 1 0-1.41l2.83-2.83a3 3 0 1 1 4.24 4.24l-2.12 2.12a3 3 0 0 1-4.24 0 .999.999 0 1 0-1.41 1.41 5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 1 0-7.07-7.07L9.17 10.6a1 1 0 0 0 1.42 1.41Zm2.82-2.82a1 1 0 1 0-1.41-1.41L9.88 11.3a5 5 0 1 0 7.07 7.07l2.83-2.83a1 1 0 1 0-1.41-1.41l-2.83 2.83a3 3 0 1 1-4.24-4.24l2.11-2.12Z"/></svg>
      </span>
      <span class="platform-chip yt" title="YouTube">
        <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.11-2.12C19 4.5 12 4.5 12 4.5s-7 0-8.89.58A3 3 0 0 0 1 7.2 31.4 31.4 0 0 0 .5 12 31.4 31.4 0 0 0 1 16.8a3 3 0 0 0 2.11 2.12C5 19.5 12 19.5 12 19.5s7 0 8.89-.58A3 3 0 0 0 23 16.8a31.4 31.4 0 0 0 .5-4.8 31.4 31.4 0 0 0-.5-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"/></svg>
      </span>
    </div>
    <div class="orbit-ring r2"></div>
    <div class="orbit-ring r3"></div>
  </div>
  <main class="relative z-10 mx-auto w-full max-w-5xl px-4 py-8 sm:px-8 sm:py-12">
    <section class="glass rounded-3xl border border-borderc bg-white/85 shadow-glow">
      <div class="border-b border-borderc px-5 py-5 sm:px-8">
        <p class="text-xs font-bold uppercase tracking-[0.28em] text-accent">TelePort Pipeline</p>
        <h1 class="mt-1 text-3xl font-extrabold tracking-tight sm:text-4xl">Download, Pick Format, Upload</h1>
        <p class="mt-2 text-sm text-slate-600">
          Destination: <span class="font-semibold">{{ upload_destination }}</span>
          <span class="mx-2">|</span>
          Max size: <span class="font-semibold">{{ max_size_mb }} MB</span>
        </p>
      </div>

      <div class="grid gap-6 px-5 py-5 sm:grid-cols-5 sm:px-8 sm:py-7">
        <form id="downloadForm" class="space-y-4 sm:col-span-3">
          <div class="input-orbit-wrap">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="url">Media URL</label>
            <div class="input-orbit-layer" aria-hidden="true">
              <div class="input-ring">
                <span class="input-chip ig" title="Instagram">
                  <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5Zm8.95 1.55a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6ZM12 7.1A4.9 4.9 0 1 1 7.1 12 4.9 4.9 0 0 1 12 7.1Zm0 1.8A3.1 3.1 0 1 0 15.1 12 3.1 3.1 0 0 0 12 8.9Z"/></svg>
                </span>
                <span class="input-chip fb" title="Facebook">
                  <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 22v-8.2h2.76l.42-3.2h-3.18V8.56c0-.93.26-1.56 1.59-1.56h1.7V4.14c-.82-.1-1.65-.15-2.47-.14-2.45 0-4.12 1.5-4.12 4.25v2.37H7v3.2h2.81V22h3.29Z"/></svg>
                </span>
              </div>
              <div class="input-ring rev">
                <span class="input-chip x" title="X">
                  <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.78L23.2 22h-6.3l-4.94-6.95L5.9 22H2.8l7.3-8.34L.8 2h6.45l4.45 6.27L18.9 2Zm-1.1 18h1.75L6.3 3.9H4.43L17.8 20Z"/></svg>
                </span>
                <span class="input-chip yt" title="YouTube">
                  <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.11-2.12C19 4.5 12 4.5 12 4.5s-7 0-8.89.58A3 3 0 0 0 1 7.2 31.4 31.4 0 0 0 .5 12 31.4 31.4 0 0 0 1 16.8a3 3 0 0 0 2.11 2.12C5 19.5 12 19.5 12 19.5s7 0 8.89-.58A3 3 0 0 0 23 16.8a31.4 31.4 0 0 0 .5-4.8 31.4 31.4 0 0 0-.5-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"/></svg>
                </span>
              </div>
            </div>
            <input id="url" type="url" required class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm" placeholder="https://..." />
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="fileName">File Name</label>
              <input id="fileName" type="text" class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm" placeholder="Auto from metadata" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="destination">Upload Destination</label>
              <select id="destination" class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm">
                <option value="telegram">Telegram</option>
                <option value="google_drive">Google Drive</option>
              </select>
            </div>
          </div>

          <div id="formatWrap" class="hidden">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="formatSelect">Format (Video + Audio)</label>
            <select id="formatSelect" class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm"></select>
            <p class="mt-1 text-xs text-slate-500" id="formatHint">Best merged format list from yt-dlp.</p>
          </div>

          <div id="resolutionWrap" class="hidden">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="resolution">Fallback Resolution</label>
            <select id="resolution" class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm">
              <option value="720">720p</option>
              <option value="1080" selected>1080p</option>
              <option value="1440">2K</option>
              <option value="2160">4K</option>
            </select>
          </div>

          <div id="thumbWrap" class="hidden">
            <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-600" for="thumbnailUrl">Thumbnail URL (Telegram + m3u8)</label>
            <input id="thumbnailUrl" type="url" class="field w-full rounded-xl border border-borderc bg-panel px-4 py-3 text-sm" placeholder="https://...jpg" />
          </div>

          <div class="flex flex-wrap gap-3 pt-1">
            <button id="submitBtn" type="submit" class="rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white transition hover:bg-emerald-700">Start Job</button>
            <button id="cancelBtn" type="button" disabled class="rounded-xl bg-warn px-5 py-3 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:opacity-50">Cancel</button>
          </div>
        </form>

        <aside class="sm:col-span-2">
          <div class="rounded-2xl border border-borderc bg-mist p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Status</p>
            <p id="statusText" class="mt-2 text-sm font-semibold text-slate-700">Idle</p>

            <div class="mt-4 h-3 overflow-hidden rounded-full bg-slate-200">
              <div id="progressBar" class="progress-shimmer h-full rounded-full bg-gradient-to-r from-accent2 via-accent to-emerald-500 transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressLabel" class="mt-2 text-xs text-slate-600">0%</p>

            <div class="mt-4 rounded-xl border border-borderc bg-white p-3 text-xs text-slate-600">
              <p class="font-semibold text-slate-700">Active Stage</p>
              <p id="detailText" class="mt-1">Waiting for input</p>
            </div>

            <div id="result" class="mt-4 text-sm"></div>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const urlInput = document.getElementById("url");
    const fileNameInput = document.getElementById("fileName");
    const destinationInput = document.getElementById("destination");
    const resolutionWrap = document.getElementById("resolutionWrap");
    const resolutionInput = document.getElementById("resolution");
    const thumbWrap = document.getElementById("thumbWrap");
    const thumbnailUrlInput = document.getElementById("thumbnailUrl");
    const formatWrap = document.getElementById("formatWrap");
    const formatSelect = document.getElementById("formatSelect");
    const formatHint = document.getElementById("formatHint");

    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const statusText = document.getElementById("statusText");
    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const detailText = document.getElementById("detailText");
    const result = document.getElementById("result");

    const defaultDestination = "{{ upload_destination }}";
    const LS = {
      destination: "teleport.destination",
      activeJobId: "teleport.activeJobId",
      draft: "teleport.formDraft",
      status: "teleport.lastStatus",
    };

    let pollTimer = null;
    let currentJobId = null;
    let infoTimer = null;
    let infoToken = 0;
    let autoFilledName = "";

    function normalizeDestination(value) {
      return value === "google_drive" ? "google_drive" : "telegram";
    }

    function setStatus(message, mode = "normal") {
      statusText.textContent = message;
      statusText.className = "mt-2 text-sm font-semibold ";
      if (mode === "error") {
        statusText.classList.add("text-red-600");
      } else if (mode === "success") {
        statusText.classList.add("text-emerald-700");
      } else {
        statusText.classList.add("text-slate-700");
      }
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomizePageOrbits() {
      const rings = document.querySelectorAll(".orbit-ring");
      const baseSizes = [900, 700, 520];
      rings.forEach((ring, idx) => {
        const size = Math.max(320, baseSizes[idx] + rand(-130, 130));
        ring.style.width = `${size}px`;
        ring.style.height = `${size}px`;
        ring.style.left = `${rand(34, 66)}%`;
        ring.style.top = `${rand(48, 70)}%`;
        // Do NOT touch animationDuration / animationDirection here.
        // Changing those properties mid-run resets the keyframe position to 0°,
        // causing a jarring "snap" on every interval tick.
      });

      const chips = document.querySelectorAll(".orbit-ring.r1 .platform-chip");
      chips.forEach((chip) => {
        chip.style.left = `${rand(6, 84)}%`;
        chip.style.top = `${rand(6, 84)}%`;
        chip.style.right = "auto";
        chip.style.bottom = "auto";
      });
    }

    function randomizeInputOrbits() {
      const rings = document.querySelectorAll(".input-ring");
      rings.forEach((ring) => {
        ring.style.width = `calc(100% + ${rand(24, 110).toFixed(0)}px)`;
        ring.style.height = `${rand(100, 170).toFixed(0)}px`;
        // Do NOT touch animationDuration / animationDirection here.
      });

      const chips = document.querySelectorAll(".input-orbit-layer .input-chip");
      chips.forEach((chip) => {
        chip.style.left = `${rand(6, 88)}%`;
        chip.style.top = `${rand(2, 78)}%`;
        chip.style.right = "auto";
        chip.style.bottom = "auto";
      });
    }

    function clearPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function setRunningState(running) {
      submitBtn.disabled = running;
      cancelBtn.disabled = !running;
      urlInput.disabled = running;
      fileNameInput.disabled = running;
      destinationInput.disabled = running;
      resolutionInput.disabled = running;
      thumbnailUrlInput.disabled = running;
      formatSelect.disabled = running;
    }

    function renderProgress(progress) {
      const safe = Math.max(0, Math.min(100, Number(progress) || 0));
      progressBar.style.width = `${safe}%`;
      progressLabel.textContent = `${safe}%`;
    }

    function isM3u8Url(rawUrl) {
      try {
        return new URL(rawUrl).pathname.toLowerCase().endsWith(".m3u8");
      } catch {
        return false;
      }
    }

    function persistDraft() {
      const draft = {
        url: urlInput.value.trim(),
        file_name: fileNameInput.value.trim(),
        destination: normalizeDestination(destinationInput.value),
        resolution: resolutionInput.value,
        thumbnail_url: thumbnailUrlInput.value.trim(),
      };
      localStorage.setItem(LS.destination, draft.destination);
      localStorage.setItem(LS.draft, JSON.stringify(draft));
    }

    function restoreDraft() {
      const savedDestination = normalizeDestination(localStorage.getItem(LS.destination) || defaultDestination);
      destinationInput.value = savedDestination;

      const raw = localStorage.getItem(LS.draft);
      if (!raw) {
        return;
      }
      try {
        const draft = JSON.parse(raw);
        urlInput.value = draft.url || "";
        fileNameInput.value = draft.file_name || "";
        resolutionInput.value = draft.resolution || "1080";
        thumbnailUrlInput.value = draft.thumbnail_url || "";
      } catch {
      }
    }

    function clearDraftFields() {
      urlInput.value = "";
      fileNameInput.value = "";
      thumbnailUrlInput.value = "";
      resolutionInput.value = "1080";
      formatSelect.innerHTML = "";
      formatWrap.classList.add("hidden");
      resolutionWrap.classList.add("hidden");
      autoFilledName = "";
      toggleThumbnailVisibility();
      localStorage.removeItem(LS.draft);
    }

    function clearSourceMetadataFields() {
      fileNameInput.value = "";
      autoFilledName = "";
      formatSelect.innerHTML = "";
      formatWrap.classList.add("hidden");
      resolutionWrap.classList.add("hidden");
    }

    function restoreLastStatus() {
      const raw = localStorage.getItem(LS.status);
      if (!raw) return;
      try {
        const saved = JSON.parse(raw);
        if (!saved || saved.status !== "completed") return;
        result.className = "mt-4 text-sm text-emerald-700";
        result.textContent = "Last job completed successfully.";
      } catch {
      }
    }

    function toggleThumbnailVisibility() {
      const needsThumb = normalizeDestination(destinationInput.value) === "telegram" && isM3u8Url(urlInput.value.trim());
      thumbWrap.classList.toggle("hidden", !needsThumb);
      thumbnailUrlInput.required = needsThumb;
      if (!needsThumb) {
        thumbnailUrlInput.value = "";
      }
    }

    function setFormatOptions(options, allowResolutionFallback) {
      formatSelect.innerHTML = "";
      if (!Array.isArray(options) || !options.length) {
        formatWrap.classList.add("hidden");
        resolutionWrap.classList.toggle("hidden", !allowResolutionFallback);
        formatHint.textContent = "No merged format list available. Using fallback resolution mode.";
        return;
      }

      const frag = document.createDocumentFragment();
      for (const item of options) {
        const option = document.createElement("option");
        option.value = JSON.stringify({ format_id: item.format_id, audio_format_id: item.audio_format_id });
        option.textContent = `${item.display_index}. ${item.resolution} | ${item.codec_pair} | ${item.filesize_str} | ${item.container.toUpperCase()}`;
        frag.appendChild(option);
      }
      formatSelect.appendChild(frag);

      formatWrap.classList.remove("hidden");
      resolutionWrap.classList.add("hidden");
      formatHint.textContent = "Pick from merged stream options generated from yt-dlp metadata.";
    }

    async function fetchMediaInfo(url) {
      const res = await fetch("/media-info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) {
        return null;
      }
      return res.json();
    }

    async function fetchFormats(url) {
      const res = await fetch("/formats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) {
        return null;
      }
      return res.json();
    }

    async function refreshMediaInfo() {
      const rawUrl = urlInput.value.trim();
      toggleThumbnailVisibility();
      if (!rawUrl) {
        formatWrap.classList.add("hidden");
        resolutionWrap.classList.add("hidden");
        return;
      }

      const token = ++infoToken;
      const info = await fetchMediaInfo(rawUrl);
      if (token !== infoToken || !info) {
        return;
      }

      if (!fileNameInput.value.trim()) {
        fileNameInput.value = info.title || "";
        autoFilledName = fileNameInput.value;
      }

      const formatData = await fetchFormats(rawUrl);
      if (token !== infoToken || !formatData) {
        formatWrap.classList.add("hidden");
        resolutionWrap.classList.toggle("hidden", !info.is_youtube);
        return;
      }
      setFormatOptions(formatData.formats || [], Boolean(info.is_youtube));
      if (!formatData.formats || !formatData.formats.length) {
        resolutionWrap.classList.toggle("hidden", !info.is_youtube);
      }
    }

    async function submitDownload(payload) {
      const res = await fetch("/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await res.json();
      if (!res.ok) {
        throw new Error(body.detail || "Request failed");
      }
      return body;
    }

    async function pollStatus(jobId) {
      try {
        const res = await fetch(`/status/${jobId}`);
        if (!res.ok) {
          throw new Error("Status check failed");
        }

        const data = await res.json();
        renderProgress(data.progress);
        setStatus(`${String(data.status || "").toUpperCase()} - ${data.stage || "running"}`);
        detailText.textContent = data.detail || "Processing";

        if (data.status === "completed") {
          clearPolling();
          currentJobId = null;
          localStorage.removeItem(LS.activeJobId);
          setRunningState(false);
          setStatus("Completed", "success");
          result.className = "mt-4 text-sm text-emerald-700";
          result.textContent = "Upload completed successfully.";
          localStorage.setItem(LS.status, JSON.stringify({ status: "completed", at: Date.now() }));
          clearDraftFields();
          return;
        }

        if (data.status === "failed" || data.status === "canceled") {
          clearPolling();
          currentJobId = null;
          localStorage.removeItem(LS.activeJobId);
          setRunningState(false);
          if (data.status === "failed") {
            setStatus(data.error || "Failed", "error");
            detailText.textContent = data.detail || "Processing failed";
            result.className = "mt-4 text-sm text-red-600";
            result.textContent = data.detail || data.error || "Unknown error";
            localStorage.removeItem(LS.status);
          } else {
            setStatus("Canceled", "normal");
            detailText.textContent = data.detail || "Canceled";
            result.className = "mt-4 text-sm text-slate-600";
            result.textContent = "Job canceled.";
            localStorage.removeItem(LS.status);
          }
        }
      } catch (err) {
        clearPolling();
        currentJobId = null;
        localStorage.removeItem(LS.activeJobId);
        setRunningState(false);
        setStatus("Polling error", "error");
        detailText.textContent = err.message || "Could not read status";
        localStorage.removeItem(LS.status);
      }
    }

    async function cancelCurrentJob() {
      if (!currentJobId) return;
      try {
        cancelBtn.disabled = true;
        const res = await fetch(`/cancel/${currentJobId}`, { method: "POST" });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Cancel request failed");
        }
        setStatus("Cancel requested...");
      } catch (err) {
        cancelBtn.disabled = false;
        setStatus(`Cancel failed: ${err.message}`, "error");
      }
    }

    function restoreActiveJob() {
      const saved = localStorage.getItem(LS.activeJobId);
      if (!saved) return;
      currentJobId = saved;
      setRunningState(true);
      setStatus("Restored active job");
      detailText.textContent = "Resuming status tracking after refresh";
      pollTimer = setInterval(() => pollStatus(saved), 1500);
      pollStatus(saved);
    }

    destinationInput.addEventListener("change", () => {
      destinationInput.value = normalizeDestination(destinationInput.value);
      toggleThumbnailVisibility();
      persistDraft();
    });

    fileNameInput.addEventListener("input", () => {
      if (fileNameInput.value.trim() !== autoFilledName) {
        autoFilledName = "";
      }
      persistDraft();
    });

    thumbnailUrlInput.addEventListener("input", persistDraft);
    resolutionInput.addEventListener("change", persistDraft);
    formatSelect.addEventListener("change", persistDraft);

    urlInput.addEventListener("input", () => {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        clearSourceMetadataFields();
      } else if (fileNameInput.value.trim() && fileNameInput.value.trim() === autoFilledName) {
        fileNameInput.value = "";
        autoFilledName = "";
      }
      toggleThumbnailVisibility();
      clearTimeout(infoTimer);
      infoTimer = setTimeout(() => {
        if (!urlInput.value.trim()) {
          clearSourceMetadataFields();
        } else {
          refreshMediaInfo();
        }
        persistDraft();
      }, 450);
    });

    cancelBtn.addEventListener("click", cancelCurrentJob);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearTimeout(infoTimer);
      clearPolling();

      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        setStatus("URL is required", "error");
        return;
      }

      setRunningState(true);
      renderProgress(0);
      result.textContent = "";
      setStatus("Submitting request...");
      detailText.textContent = "Queueing job";

      try {
        const payload = {
          url: rawUrl,
          upload_destination: normalizeDestination(destinationInput.value),
        };

        const editedName = fileNameInput.value.trim();
        if (editedName) {
          payload.file_name = editedName;
        }

        if (payload.upload_destination === "telegram" && isM3u8Url(rawUrl)) {
          const thumb = thumbnailUrlInput.value.trim();
          if (!thumb) {
            throw new Error("Thumbnail URL is required for Telegram m3u8 uploads");
          }
          payload.thumbnail_url = thumb;
        }

        const chosenFormatRaw = formatWrap.classList.contains("hidden") ? "" : formatSelect.value;
        if (chosenFormatRaw) {
          const chosen = JSON.parse(chosenFormatRaw);
          payload.format_id = chosen.format_id;
          if (chosen.audio_format_id) {
            payload.audio_format_id = chosen.audio_format_id;
          }
        } else if (!resolutionWrap.classList.contains("hidden")) {
          const chosenResolution = Number(resolutionInput.value);
          if (Number.isInteger(chosenResolution) && chosenResolution > 0) {
            payload.resolution = chosenResolution;
          }
        }

        persistDraft();
        const response = await submitDownload(payload);
        currentJobId = response.job_id;
        localStorage.setItem(LS.activeJobId, currentJobId);

        setStatus("Job queued");
        detailText.textContent = "Starting pipeline";

        pollTimer = setInterval(() => pollStatus(currentJobId), 1500);
        pollStatus(currentJobId);
      } catch (err) {
        currentJobId = null;
        localStorage.removeItem(LS.activeJobId);
        setRunningState(false);
        setStatus("Request failed", "error");
        detailText.textContent = err.message || "Could not create job";
        result.className = "mt-4 text-sm text-red-600";
        result.textContent = err.message || "Could not create job";
      }
    });

    restoreDraft();
    restoreLastStatus();
    toggleThumbnailVisibility();
    randomizePageOrbits();
    randomizeInputOrbits();
    setInterval(() => {
      randomizePageOrbits();
      randomizeInputOrbits();
    }, 16000);
    setRunningState(false);
    if (urlInput.value.trim()) {
      refreshMediaInfo();
    }
    restoreActiveJob();
  </script>
</body>
</html>
